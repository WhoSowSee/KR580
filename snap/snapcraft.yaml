name: kr580
base: core24
version: git
summary: KR580 desktop emulator
description: |
  KR580 is a desktop emulator for a KR580VM80 / Intel 8080-style system.
  It opens .580 snapshots and .krs subprograms directly from the desktop.
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  kr580:
    command: bin/k580
    desktop: usr/share/applications/kr580.desktop
    extensions: [gpu]
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - removable-media
      - wayland
      - x11

parts:
  kr580:
    plugin: rust
    source: .
    rust-channel: "1.88.0"
    rust-path: [crates/ui]
    rust-cargo-parameters: [--bin, k580]
    build-packages:
      - desktop-file-utils
    stage-packages:
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxrandr2
      - zenity
    override-build: |
      craftctl default
      install -Dm644 "$CRAFT_PART_SRC/crates/ui/assets/icons/icon-256.png" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/kr580.png"
      desktop="$CRAFT_PART_INSTALL/usr/share/applications/kr580.desktop"
      mkdir -p "$(dirname "$desktop")"
      grep -Fq 'Exec=@EXEC@ %f' \
        "$CRAFT_PART_SRC/crates/ui/assets/linux/kr580-package.desktop"
      sed 's/@EXEC@/kr580/g' \
        "$CRAFT_PART_SRC/crates/ui/assets/linux/kr580-package.desktop" > "$desktop"
      ! grep -Fq '@EXEC@' "$desktop"
      desktop-file-validate "$desktop"
