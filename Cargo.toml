[workspace]
members = [
    "crates/core",
    "crates/ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "2.1.0"
rust-version = "1.88"
repository = "https://github.com/WhoSowSee/KR580"
homepage = "https://github.com/WhoSowSee/KR580"
readme = "README-EN.md"
keywords = ["emulator", "8080", "kr580", "desktop"]
categories = ["emulators"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "fs", "sync"] }
crossbeam-channel = "0.5"
iced = { version = "0.14.0", default-features = false, features = ["crisp", "tiny-skia", "tokio", "wayland", "web-colors", "wgpu", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["wayland", "xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
rust_xlsxwriter = "0.99"
calamine = "0.36"
