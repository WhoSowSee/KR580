name: Build release packages

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  PROJECT_NAME: KR580-Setup

permissions:
  contents: write

jobs:
  linux-integration:
    name: Linux desktop integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libglib2.0-bin shared-mime-info

      - name: Test isolated association ownership
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p kr580 --lib file_assoc::
          cargo test --locked -p kr580 --lib macos_bundle::tests
          cargo test --locked -p kr580 --test linux_associations

      - name: Test rendered Desktop Entry launch
        run: >-
          cargo test --locked -p kr580 --lib
          file_assoc::linux::tests::desktop_entry_consumer_preserves_executable_and_file_arguments
          -- --ignored --exact

      - name: Validate desktop metadata caches
        run: bash scripts/verify_linux_metadata.sh

      - name: Validate release artifact naming
        run: bash scripts/verify_release_artifact_names.sh

  linux:
    name: Linux installer ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - sparc64-unknown-linux-gnu

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}

      - name: Clean target before cross build
        run: rm -rf target

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev zip

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build installer
        env:
          KR580_CARGO: cross
        run: bash scripts/build_installer.sh release --target ${{ matrix.target }} --dist-dir dist

      - name: Package installer zip
        run: |
          mkdir -p artifacts
          installer=$(ls dist/KR580-Setup-*-${{ matrix.target }})
          zip -j "artifacts/${PROJECT_NAME}-${{ matrix.target }}.zip" "$installer"

      - name: Build deb package
        run: |
          installer=$(ls dist/KR580-Setup-*-${{ matrix.target }})
          bash scripts/package_installer_deb.sh \
            --installer "$installer" \
            --target ${{ matrix.target }} \
            --output "artifacts/${PROJECT_NAME}-${{ matrix.target }}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kr580-linux-${{ matrix.target }}
          path: artifacts/*

  macos:
    name: macOS application image ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check macOS integration
        run: |
          rustup component add clippy
          cargo clippy --locked -p kr580 --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --locked -p kr580 --lib macos_bundle::tests

      - name: Build and validate application image
        run: bash scripts/build_macos_dmg.sh release --target ${{ matrix.target }} --dist-dir artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kr580-macos-${{ matrix.target }}
          path: artifacts/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Profile release -Target ${{ matrix.target }} -DistDir dist

      - name: Test isolated Windows associations
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked -p kr580 --lib file_assoc::windows::tests

      - name: Package installer zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = Get-ChildItem -Path dist -Filter "KR580-Setup-*-${{ matrix.target }}.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "installer artifact not found" }
          Compress-Archive -Path $installer.FullName -DestinationPath "artifacts/${env:PROJECT_NAME}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kr580-windows-${{ matrix.target }}
          path: artifacts/*

  snap:
    name: Snap application ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install LXD and Snapcraft
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils squashfs-tools
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd runner
          sudo snap install lxd
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo snap install --channel 9.x/stable --classic snapcraft

      - name: Build snap
        run: sudo -u runner -E snapcraft pack --use-lxd --build-for=${{ matrix.arch }}

      - name: Validate and collect snap
        run: |
          set -euo pipefail
          mapfile -t snaps < <(compgen -G "*_${{ matrix.arch }}.snap")
          if [ "${#snaps[@]}" -ne 1 ]; then
            printf 'expected one snap, found %s\n' "${#snaps[@]}" >&2
            exit 1
          fi
          snap_name=${snaps[0]}
          check_root=$(mktemp -d)
          check_dir="$check_root/root"
          unsquashfs -d "$check_dir" "$snap_name" >/dev/null
          test -x "$check_dir/bin/kr580"
          test ! -e "$check_dir/bin/k580-installer"
          test ! -e "$check_dir/bin/k580-uninstaller"
          desktop-file-validate "$check_dir/meta/gui/kr580.desktop"
          grep -Fq 'command: bin/kr580' "$check_dir/meta/snap.yaml"
          grep -Fq 'MimeType=application/x-kr580;' "$check_dir/meta/gui/kr580.desktop"
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          mkdir -p artifacts
          mv "$snap_name" "artifacts/KR580-${version}-${{ matrix.arch }}.snap"

      - name: Upload snaps
        uses: actions/upload-artifact@v7
        with:
          name: kr580-snap-${{ matrix.arch }}
          path: artifacts/*.snap
          if-no-files-found: error

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate flake outputs
        run: nix flake check --no-build --print-build-logs

      - name: Build Nix package
        run: nix build .#packages.x86_64-linux.default --print-build-logs

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - linux-integration
      - linux
      - macos
      - windows
      - snap
      - nix
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set version
        run: echo "VERSION=${GITHUB_REF##*/}" >> "$GITHUB_ENV"

      - name: Extract tag metadata
        id: tag_meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          COMMIT=$(git rev-list -n 1 "$TAG")
          TAG_MESSAGE=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          if [ -z "${TAG_MESSAGE//[$'\r\n\t ']/}" ]; then
            TAG_MESSAGE=$(git tag -l "$TAG" --format='%(contents)')
          fi
          COMMIT_MESSAGE=$(git show -s --format=%B "$COMMIT")
          CHANGELOG_SECTION=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SECTION=$(awk -v ver="$VERSION" '
              function trim(str) {
                sub(/^[[:space:]]+/, "", str)
                sub(/[[:space:]]+$/, "", str)
                return str
              }
              /^## \[/ {
                if (match($0, /^## \[([^\]]+)\]/, m)) {
                  heading = trim(m[1])
                  if (found && heading != ver) {
                    exit
                  }
                  if (!found && heading == ver) {
                    found = 1
                    next
                  }
                }
              }
              found {
                if (!printed) {
                  if ($0 ~ /^[[:space:]]*$/) {
                    next
                  }
                  printed = 1
                  print
                  next
                }
                print
              }
            ' CHANGELOG.md)
          fi
          if [ -n "$(printf '%s' "$CHANGELOG_SECTION" | tr -d $'\r\n\t ')" ]; then
            MESSAGE="$CHANGELOG_SECTION"
          elif [ -n "$(printf '%s' "$TAG_MESSAGE" | tr -d $'\r\n\t ')" ]; then
            MESSAGE="$TAG_MESSAGE"
          else
            MESSAGE="$COMMIT_MESSAGE"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          printf 'message<<EOF\n%s\nEOF\n' "$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub release notes
        id: gh_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(gh api repos/${GITHUB_REPOSITORY}/releases/generate-notes \
            -f tag_name="${{ steps.tag_meta.outputs.tag }}" \
            -f target_commitish="${{ steps.tag_meta.outputs.commit }}")
          body=$(echo "$response" | jq -r '.body // ""')
          printf 'body<<EOF\n%s\nEOF\n' "$body" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts with version
        run: bash scripts/version_release_artifacts.sh dist "$VERSION"

      - name: Compose release body
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ENGLISH_CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG-EN.md"
          {
            printf '%s\n\n' "$TAG_MESSAGE";
            echo '---';
            echo;
            printf '%s\n' "$GENERATED_NOTES";
            printf '\nEnglish Changelog: [CHANGELOG-EN.md](%s)\n' "$ENGLISH_CHANGELOG_URL";
          } > release-notes.md
        env:
          TAG_MESSAGE: ${{ steps.tag_meta.outputs.message }}
          GENERATED_NOTES: ${{ steps.gh_notes.outputs.body }}

      - name: List packaged files
        run: ls -R dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
