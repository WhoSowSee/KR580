name: Feature request
description: Suggest a change to KR580
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues](https://github.com/WhoSowSee/KR580/issues) and [open pull requests](https://github.com/WhoSowSee/KR580/pulls) for the same idea.
        Discuss large features, public API changes, and changes to CPU semantics or file formats before implementing them.
        AI-assisted requests must follow the [AI Policy](https://github.com/WhoSowSee/KR580/blob/main/AI_POLICY.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you need to do with KR580 and what is missing from the current workflow.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Show how it would work with an example program, device setup, UI workflow, or command. Explain compatibility effects for public APIs or file formats if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Mention existing options or workarounds you have tried, and link relevant project documentation or examples.
